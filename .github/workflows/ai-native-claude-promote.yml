name: AI Native Claude Pilot Promotion

on:
  workflow_dispatch:
    inputs:
      pilot_run_id:
        description: GitHub Actions run ID that produced the validated Claude R7 pilot artifact
        required: true
        type: string
      artifact_name:
        description: Exact artifact name shown on the pilot run
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the current R7 controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the selected pilot handoff
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pilot_run_id }}
          name: ${{ inputs.artifact_name }}
          path: pilot-handoff

      - name: Validate and promote freeze metadata
        run: |
          set -euo pipefail
          test -d pilot-handoff/pilot-runs
          python3 scripts/promote-ai-native-pilot-handoff.py \
            --handoff-dir pilot-handoff

      - name: Open a reviewable promotion pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PILOT_RUN_ID: ${{ inputs.pilot_run_id }}
        run: |
          set -euo pipefail
          branch="research/ai-native-formal-execution-r1-${PILOT_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add \
            docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/runner/execution-profile-r1.json \
            docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/runner/formal-schedule-r1.json \
            docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/runner/formal-plan-r1.lock.json \
            docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/runner/PILOT-FREEZE.json
          git diff --cached --check
          git commit -m 'research: promote Claude R7 pilot freeze metadata'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$branch"
          cat > /tmp/pr-body.md <<EOF
          This PR promotes the validated, non-reportable Claude Code R7 pilot handoff from Actions run ${PILOT_RUN_ID}.

          The required T05/A, T08/B, and T20/C evidence was validated before these four files were generated. Review the hashes and merge this PR before dispatching formal collection. The pilot traces remain in the source Actions artifact.
          EOF
          gh pr create \
            --base main \
            --head "$branch" \
            --draft \
            --title 'research: promote Claude R7 pilot freeze' \
            --body-file /tmp/pr-body.md
