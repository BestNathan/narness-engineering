name: one-shot-code-locator-dispatch
# retry after transient TypeSafe 520

on:
  push:
    paths:
      - ".github/workflows/one-shot-code-locator-dispatch.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch real Code Locator experiment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/actions/workflows/system-one-code-locator.yml/dispatches"             -d '{
              "ref": "main",
              "inputs": {
                "subject_repository": "BestNathan/nession",
                "subject_ref": "staging",
                "query": "Help me optimize the websocket connection implementation",
                "directory_threshold": "0.35",
                "file_threshold": "0.50",
                "line_threshold": "0.70",
                "batch_size": "48",
                "model": "jev-latest",
                "run_typesafe": "true"
              }
            }'
