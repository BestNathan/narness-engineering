name: system-one-k8s-experiment

on:
  push:
    paths:
      - "examples/system-one-k8s/**"
      - "docs/topics/system-one-progressive-action-space/**"
      - ".github/workflows/system-one-k8s-experiment.yml"
  pull_request:
    paths:
      - "examples/system-one-k8s/**"
      - "docs/topics/system-one-progressive-action-space/**"
      - ".github/workflows/system-one-k8s-experiment.yml"
  workflow_dispatch:
    inputs:
      goal:
        description: Natural-language Kubernetes request evaluated by the demo
        required: true
        default: Show me the Kubernetes logs for nession in staging.
        type: string
      run_typesafe:
        description: Also run the real TypeSafe System One API experiment
        required: true
        default: false
        type: boolean
      model:
        description: TypeSafe model alias
        required: true
        default: jev-latest
        type: string

permissions:
  contents: read

concurrency:
  group: system-one-k8s-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: false

env:
  EXPERIMENT_GOAL: \${{ inputs.goal || 'Show me the Kubernetes logs for nession in staging.' }}
  TYPESAFE_MODEL: \${{ inputs.model || 'jev-latest' }}
  FIXTURE: examples/system-one-k8s/fixtures/cluster.json

jobs:
  offline:
    name: Offline state-machine validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare artifact directory
        run: mkdir -p artifacts/system-one-k8s/offline

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover \
            -s examples/system-one-k8s \
            -p 'test_*.py' \
            -v 2>&1 | tee artifacts/system-one-k8s/offline/tests.log

      - name: Run deterministic fixture experiment
        shell: bash
        run: |
          set -o pipefail
          python3 examples/system-one-k8s/system_one_k8s.py \
            "$EXPERIMENT_GOAL" \
            --fixture "$FIXTURE" \
            --offline-decider \
            --state-output artifacts/system-one-k8s/offline/state.json \
            --trace-output artifacts/system-one-k8s/offline/trace.jsonl \
            2>&1 | tee artifacts/system-one-k8s/offline/run.log

      - name: Analyze trace
        shell: bash
        run: |
          set -o pipefail
          python3 examples/system-one-k8s/analyze_trace.py \
            --trace artifacts/system-one-k8s/offline/trace.jsonl \
            --state artifacts/system-one-k8s/offline/state.json \
            --json-output artifacts/system-one-k8s/offline/analysis.json \
            --markdown-output artifacts/system-one-k8s/offline/analysis.md \
            2>&1 | tee artifacts/system-one-k8s/offline/analyze.log

      - name: Save run metadata
        env:
          RUN_ID: \${{ github.run_id }}
          RUN_ATTEMPT: \${{ github.run_attempt }}
          COMMIT_SHA: \${{ github.sha }}
          REF_NAME: \${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "mode": "offline",
              "goal": os.environ["EXPERIMENT_GOAL"],
              "model": None,
              "github_run_id": os.environ["RUN_ID"],
              "github_run_attempt": os.environ["RUN_ATTEMPT"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "ref_name": os.environ["REF_NAME"],
          }
          Path("artifacts/system-one-k8s/offline/metadata.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish analysis to job summary
        if: always()
        run: |
          if test -f artifacts/system-one-k8s/offline/analysis.md; then
            cat artifacts/system-one-k8s/offline/analysis.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload offline experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-one-k8s-offline-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: artifacts/system-one-k8s/offline/
          if-no-files-found: error
          retention-days: 30

  typesafe:
    name: Real TypeSafe System One experiment
    if: \${{ github.event_name == 'workflow_dispatch' && inputs.run_typesafe }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Require TypeSafe API secret
        env:
          TYPESAFE_API_KEY: \${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if test -z "$TYPESAFE_API_KEY"; then
            echo "Repository secret TYPESAFE_API_KEY is required for run_typesafe=true." >&2
            exit 1
          fi

      - name: Prepare artifact directory
        run: mkdir -p artifacts/system-one-k8s/typesafe

      - name: Run real System One experiment
        env:
          TYPESAFE_API_KEY: \${{ secrets.TYPESAFE_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python3 examples/system-one-k8s/system_one_k8s.py \
            "$EXPERIMENT_GOAL" \
            --fixture "$FIXTURE" \
            --model "$TYPESAFE_MODEL" \
            --state-output artifacts/system-one-k8s/typesafe/state.json \
            --trace-output artifacts/system-one-k8s/typesafe/trace.jsonl \
            2>&1 | tee artifacts/system-one-k8s/typesafe/run.log

      - name: Analyze trace
        shell: bash
        run: |
          set -o pipefail
          python3 examples/system-one-k8s/analyze_trace.py \
            --trace artifacts/system-one-k8s/typesafe/trace.jsonl \
            --state artifacts/system-one-k8s/typesafe/state.json \
            --json-output artifacts/system-one-k8s/typesafe/analysis.json \
            --markdown-output artifacts/system-one-k8s/typesafe/analysis.md \
            2>&1 | tee artifacts/system-one-k8s/typesafe/analyze.log

      - name: Save run metadata
        env:
          RUN_ID: \${{ github.run_id }}
          RUN_ATTEMPT: \${{ github.run_attempt }}
          COMMIT_SHA: \${{ github.sha }}
          REF_NAME: \${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "mode": "typesafe",
              "goal": os.environ["EXPERIMENT_GOAL"],
              "model": os.environ["TYPESAFE_MODEL"],
              "github_run_id": os.environ["RUN_ID"],
              "github_run_attempt": os.environ["RUN_ATTEMPT"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "ref_name": os.environ["REF_NAME"],
          }
          Path("artifacts/system-one-k8s/typesafe/metadata.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish analysis to job summary
        if: always()
        run: |
          if test -f artifacts/system-one-k8s/typesafe/analysis.md; then
            cat artifacts/system-one-k8s/typesafe/analysis.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload TypeSafe experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-one-k8s-typesafe-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: artifacts/system-one-k8s/typesafe/
          if-no-files-found: warn
          retention-days: 30
