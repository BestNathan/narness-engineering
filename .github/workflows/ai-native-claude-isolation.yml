name: AI Native Claude Isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/claude-runtime/bwrap.apparmor'
      - 'scripts/narness-claude-adapter.py'
      - 'scripts/narness-selftest-claude-isolation.py'
      - '.github/workflows/ai-native-claude-isolation.yml'

permissions:
  contents: read

jobs:
  filesystem-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install namespace sandbox and pinned client
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          # Scope the user-namespace exception to the sandbox executable.
          sudo apparmor_parser -r research/claude-runtime/bwrap.apparmor
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.278
      - name: Verify production isolation without credentials or model requests
        run: |
          set -euo pipefail
          python3 scripts/narness-selftest-claude-isolation.py 2>&1 | tee isolation-check.log
      - name: Preserve isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-isolation-${{ github.run_id }}-${{ github.run_attempt }}
          path: isolation-check.log
