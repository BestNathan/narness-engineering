name: AI Native Benchmark Integrity

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*ai-native*'
      - 'docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/**'
      - '.github/workflows/ai-native-benchmark-integrity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile research scripts
        run: |
          python -m py_compile \
            scripts/ai-native-repo-experiment.py \
            scripts/score-ai-native-run.py \
            scripts/validate-ai-native-benchmark.py \
            scripts/validate-ai-native-treatment-isolation.py \
            scripts/validate-ai-native-pilot.py \
            scripts/ai-native-codex-adapter.py \
            scripts/preflight-ai-native-codex-pilots.py \
            scripts/selftest-ai-native-runner.py \
            scripts/seal-ai-native-run.py \
            scripts/verify-ai-native-run-seal.py \
            scripts/verify-ai-native-collection.py \
            scripts/selftest-ai-native-seals.py \
            scripts/aggregate-ai-native-results.py \
            scripts/analyze-ai-native-effects.py \
            scripts/generate-ai-native-research-report.py \
            scripts/review-ai-native-run.py \
            scripts/aggregate-ai-native-failures.py \
            scripts/finalize-ai-native-research.py \
            scripts/validate-ai-native-conclusion.py \
            scripts/freeze-ai-native-execution-profile.py \
            scripts/generate-ai-native-formal-schedule.py \
            scripts/freeze-ai-native-formal-plan.py \
            scripts/prepare-ai-native-formal-collection.py \
            scripts/run-ai-native-formal.py \
            scripts/inspect-ai-native-formal-progress.py

      - name: Validate paired-effects analyzer
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          fields = [
              'run_id','task_id','treatment','attempt','task_success',
              'navigation_precision','navigation_recall','irrelevant_files_read',
              'files_read','search_calls','navigation_events_before_first_edit',
              'time_to_first_relevant_artifact_ms','time_to_first_edit_ms',
              'input_tokens','repair_loops','validation_failures',
              'out_of_scope_edit_count','agent_duration_ms','first_hit_correct',
          ]
          rows = [
              ['T01-A-01','T01','A',1,True,.50,1.0,4,8,5,10,1000,2000,10000,2,2,1,5000,False],
              ['T01-B-01','T01','B',1,True,.75,1.0,2,6,3,7,700,1500,8000,1,1,0,4000,True],
              ['T01-C-01','T01','C',1,True,.80,1.0,1,5,2,5,600,1200,7000,1,1,0,3500,True],
              ['T02-A-01','T02','A',1,False,.40,.5,6,10,7,14,1400,2600,14000,3,3,2,6500,False],
              ['T02-B-01','T02','B',1,True,.70,1.0,3,7,4,8,900,1700,9000,1,1,0,4500,True],
              ['T02-C-01','T02','C',1,True,.85,1.0,2,6,3,6,700,1400,8000,1,1,0,3800,True],
          ]
          with Path('/tmp/raw-runs.csv').open('w', newline='') as fh:
              writer = csv.writer(fh)
              writer.writerow(fields)
              writer.writerows(rows)
          PY
          python scripts/analyze-ai-native-effects.py \
            --raw-runs /tmp/raw-runs.csv \
            --strata docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/analysis-strata.json \
            --output-dir /tmp/paired-effects \
            --bootstrap-samples 100
          python - <<'PY'
          import json
          x=json.load(open('/tmp/paired-effects/paired-effects.json'))
          ab=x['contrasts']['A_vs_B']
          assert ab['navigation_precision']['matched_tasks'] == 2
          assert ab['navigation_precision']['median_oriented_improvement'] > 0
          assert ab['irrelevant_files_read']['median_oriented_improvement'] > 0
          assert ab['agent_duration_ms']['median_oriented_improvement'] > 0
          PY
      - name: Validate generated research report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/paired-effects')
          summary={
              'A': {'n': 2, 'tasks': 2, 'task_success_rate': 0.5},
              'B': {'n': 2, 'tasks': 2, 'task_success_rate': 1.0},
              'C': {'n': 2, 'tasks': 2, 'task_success_rate': 1.0},
          }
          (out/'summary.json').write_text(json.dumps(summary))
          PY
          python scripts/generate-ai-native-research-report.py \
            --results-dir /tmp/paired-effects \
            --output /tmp/paired-effects/research-report.md
          grep -q 'H1 Retrieval precision' /tmp/paired-effects/research-report.md
          grep -q 'REVIEW REQUIRED' /tmp/paired-effects/research-report.md

      - name: Validate structured conclusion contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value={
            'schema_version':1,
            'experiment_id':'nession-terminal-session-reconnect-2026-09',
            'benchmark_revision':2,
            'analysis_revision':2,
            'hypotheses':{
              key:{'classification':'Inconclusive','rationale':'synthetic CI rationale'}
              for key in ('H1','H2','H3','H4','H5')
            },
            'overall_summary':'synthetic CI summary',
            'architecture_decisions':[
              {'idea':'semantic resolver','decision':'keep-experimental','rationale':'synthetic CI rationale'}
            ],
            'limitations':['synthetic CI limitation'],
          }
          Path('/tmp/conclusion.json').write_text(json.dumps(value))
          PY
          python scripts/validate-ai-native-conclusion.py \
            --conclusions /tmp/conclusion.json

      - name: Validate end-to-end research finalization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/finalize-runs')
          def write(treatment, success, precision, tokens, duration):
              d=root/f'T01-{treatment}-01'
              d.mkdir(parents=True, exist_ok=True)
              run={
                'run_id':f'T01-{treatment}-01',
                'task_id':'T01',
                'treatment':treatment,
                'attempt':1,
                'admissible_for_final_analysis':True,
                'task_success':success,
                'acceptance_ok':success,
                'verification_ok':True,
                'mutation_checks_ok':True,
                'agent_exit_ok':True,
                'wall_time_ms':duration+1000,
                'commands':{'agent':{'duration_ms':duration,'timed_out':False},'setup':[]},
              }
              score={
                'run_id':run['run_id'],'task_id':'T01','treatment':treatment,
                'metrics':{
                  'first_hit_correct': treatment!='A',
                  'navigation_precision':precision,
                  'navigation_recall':1.0,
                  'irrelevant_files_read': 4 if treatment=='A' else 1,
                  'files_read': 8 if treatment=='A' else 5,
                  'search_calls': 5 if treatment=='A' else 2,
                  'navigation_events_before_first_edit': 10 if treatment=='A' else 5,
                  'time_to_first_relevant_artifact_ms': 1000 if treatment=='A' else 500,
                  'time_to_first_edit_ms': 2000 if treatment=='A' else 1000,
                  'input_tokens':tokens,
                  'repair_loops':2 if treatment=='A' else 0,
                  'validation_failures':2 if treatment=='A' else 0,
                  'out_of_scope_edit_count':1 if treatment=='A' else 0,
                },
              }
              (d/'run.json').write_text(json.dumps(run))
              (d/'score.json').write_text(json.dumps(score))
              if not success:
                  import hashlib
                  seal={'schema_version':1,'run_id':run['run_id']}
                  seal_path=d/'seal.json'
                  seal_path.write_text(json.dumps(seal))
                  seal_sha=hashlib.sha256(seal_path.read_bytes()).hexdigest()
                  review={
                    'schema_version':1,'run_id':run['run_id'],'task_id':'T01',
                    'treatment':treatment,'task_success':False,
                    'review_policy_version':1,
                    'review_scope':'per-run-causal-review-before-aggregate-interpretation',
                    'reviewed_run_seal_sha256':seal_sha,
                    'primary_failure_code':'R5','primary_failure':'invariant missed',
                    'secondary_failure_codes':[],'secondary_failures':[],
                    'notes':'synthetic CI review',
                    'evidence':['synthetic acceptance failure'],
                  }
                  (d/'review.json').write_text(json.dumps(review))
          write('A',False,0.5,10000,5000)
          write('B',True,0.75,8000,4000)
          write('C',True,0.85,7000,3500)
          PY
          python scripts/finalize-ai-native-research.py \
            --runs-root /tmp/finalize-runs \
            --output-dir /tmp/finalize-results \
            --allow-incomplete
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('/tmp/finalize-results')
          assert (out/'research-report.md').exists()
          assert (out/'paired-effects.json').exists()
          assert (out/'research-artifact-manifest.json').exists()
          failures=json.loads((out/'failure-summary.json').read_text())
          assert failures['failed_admissible_runs'] == 1
          assert failures['missing_review_count'] == 0
          completeness=json.loads((out/'research-completeness.json').read_text())
          assert completeness['sealed_admissible_runs'] == 3
          assert completeness['hypothesis_classification_complete'] is False
          PY

      - name: Validate formal schedule and plan freezer
        run: |
          python scripts/generate-ai-native-formal-schedule.py \
            --replications 3 \
            --profile-id ci-selftest \
            --output /tmp/formal-schedule.json
          python - <<'PY'
          import json
          from pathlib import Path
          profile={
            'schema_version':1,
            'profile_id':'ci-selftest',
            'status':'frozen',
          }
          Path('/tmp/execution-profile.json').write_text(json.dumps(profile))
          PY
          python scripts/freeze-ai-native-formal-plan.py \
            --execution-profile /tmp/execution-profile.json \
            --schedule /tmp/formal-schedule.json \
            --benchmark-lock docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/BENCHMARK-LOCK.json \
            --analysis-lock docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/ANALYSIS-LOCK.json \
            --output /tmp/formal-plan.json \
            --plan-id ci-selftest-plan
          python - <<'PY'
          import json
          schedule=json.load(open('/tmp/formal-schedule.json'))
          plan=json.load(open('/tmp/formal-plan.json'))
          assert schedule['run_count'] == 216
          assert len(schedule['entries']) == 216
          assert {e['treatment'] for e in schedule['entries']} == {'A','B','C'}
          checks=plan['schedule_design_validation']
          assert checks['tasks'] == 24
          assert checks['treatments'] == 3
          assert checks['unique_run_ids'] is True
          assert checks['contiguous_sequence'] is True
          assert checks['balanced_task_treatment_cells'] is True
          assert checks['balanced_within_task_blocks'] is True
          assert checks['latin_square_positions'] is True
          for task in {e['task_id'] for e in schedule['entries']}:
              rows=[e for e in schedule['entries'] if e['task_id']==task]
              assert len(rows)==9
              for treatment in ('A','B','C'):
                  assert sum(e['treatment']==treatment for e in rows)==3
                  positions=[
                    e['within_task_position']
                    for e in rows
                    if e['treatment']==treatment
                  ]
                  assert sorted(positions)==[1,2,3]
          PY

      - name: Run isolated runner/scorer selftest
        run: python scripts/selftest-ai-native-runner.py

      - name: Run tamper-evident seal selftest
        run: python scripts/selftest-ai-native-seals.py

      - name: Validate pilot shell syntax
        run: bash -n scripts/run-ai-native-codex-pilots.sh

      - name: Replay synthetic Codex JSONL instrumentation
        run: |
          mkdir -p /tmp/ai-native-adapter
          printf 'synthetic pilot prompt\n' > /tmp/ai-native-adapter/prompt.txt
          NARNESS_RUN_DIR=/tmp/ai-native-adapter \
          NARNESS_PROMPT_FILE=/tmp/ai-native-adapter/prompt.txt \
          NARNESS_TRACE_FILE=/tmp/ai-native-adapter/trace.jsonl \
          python scripts/ai-native-codex-adapter.py \
            --replay-jsonl docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/runner/codex-replay-sample.jsonl

          python - <<'PY'
          import json
          from pathlib import Path
          events=[json.loads(x) for x in Path('/tmp/ai-native-adapter/trace.jsonl').read_text().splitlines()]
          types=[e['type'] for e in events]
          assert 'resolver' in types, types
          assert 'search' in types, types
          search_events=[e for e in events if e.get('type') == 'search']
          assert any('web/src/platform/socket/WebSocketService.ts' in e.get('results', []) for e in search_events), search_events
          assert any(e.get('type') == 'read' and e.get('path') == 'web/src/platform/socket/WebSocketService.ts' for e in events), events
          assert 'edit' in types, types
          assert 'validation' in types, types
          assert 'usage' in types, types
          PY

      - name: Clone frozen subject repository
        run: git clone https://github.com/BestNathan/nession.git /tmp/nession

      - name: Validate benchmark manifests, fixtures, mutations, and oracle
        run: |
          python scripts/validate-ai-native-benchmark.py \
            --source-repo /tmp/nession

      - name: Validate treatment variable isolation
        run: |
          python scripts/validate-ai-native-treatment-isolation.py \
            --source-repo /tmp/nession \
            --output /tmp/treatment-isolation.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/treatment-isolation.json'))
          assert x['status'] == 'pass'
          assert x['capability_count'] == 6
          assert all(x['checks'].values()), x['checks']
          PY

      - name: Validate Codex pilot preflight without Codex
        run: |
          python scripts/preflight-ai-native-codex-pilots.py \
            --source-repo /tmp/nession \
            --output-dir /tmp/ai-native-pilot-preflight \
            --skip-codex
