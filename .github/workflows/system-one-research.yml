name: System One Research Demos

on:
  push:
    paths:
      - 'examples/system-one-k8s/**'
      - 'examples/system-one-code-locator/**'
      - 'docs/topics/system-one-progressive-action-space/**'
      - '.github/workflows/system-one-research.yml'
  pull_request:
    paths:
      - 'examples/system-one-k8s/**'
      - 'examples/system-one-code-locator/**'
      - 'docs/topics/system-one-progressive-action-space/**'
      - '.github/workflows/system-one-research.yml'
  workflow_dispatch:
    inputs:
      subject_repository:
        description: Repository used by the code-localization experiment
        required: true
        default: BestNathan/nession
        type: string
      subject_ref:
        description: Git ref of the subject repository
        required: true
        default: staging
        type: string
      query:
        description: Code-localization task
        required: true
        default: Help me optimize the websocket connection implementation
        type: string
      directory_threshold:
        description: Directory Noul threshold
        required: true
        default: '0.35'
        type: string
      file_threshold:
        description: File Noul threshold
        required: true
        default: '0.50'
        type: string
      line_threshold:
        description: Source-line Noul threshold
        required: true
        default: '0.70'
        type: string
      batch_size:
        description: Noul questions per TypeSafe request
        required: true
        default: '48'
        type: string
      collect_system_one:
        description: Call the real TypeSafe System One API
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  fixtures:
    name: Deterministic fixture evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Initialize deterministic evidence directory
        run: |
          evidence="$RUNNER_TEMP/system-one-fixtures-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence/k8s" "$evidence/code-locator"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Run demo tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s examples/system-one-k8s -p 'test_*.py' -v
          python3 -m unittest discover -s examples/system-one-code-locator -p 'test_*.py' -v

      - name: Collect deterministic evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/system-one-fixtures-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence/k8s" "$evidence/code-locator"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

          python3 examples/system-one-k8s/system_one_k8s.py             "Show me the Kubernetes logs for nession in staging."             --fixture examples/system-one-k8s/fixtures/cluster.json             --offline-decider --json             | tee "$evidence/k8s/result.json"

          python3 examples/system-one-k8s/system_one_k8s.py             "Show me the Kubernetes logs for nession in staging."             --fixture examples/system-one-k8s/fixtures/cluster.json             --offline-decider             | tee "$evidence/k8s/stdout.log"

          python3 examples/system-one-code-locator/system_one_code_locator.py             examples/system-one-code-locator/fixtures/repository             "Help me optimize the websocket connection implementation"             --offline-decider             --line-threshold 0.60             --trace-file "$evidence/code-locator/trace.jsonl"             --output-json "$evidence/code-locator/result.json"             | tee "$evidence/code-locator/stdout.log"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"])
          manifest = {
              "schema_version": 1,
              "kind": "system-one-deterministic-fixture-evidence",
              "github": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              },
              "experiments": ["system-one-k8s", "system-one-code-locator"],
          }
          (root / "run-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload deterministic research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-one-fixtures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: warn

  system-one:
    name: Real System One evidence
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.collect_system_one) || (github.event_name == 'push' && github.ref == 'refs/heads/research/system-one-code-localization' && contains(github.event.head_commit.message, '[system-one-e2e]')) }}
    runs-on: ubuntu-24.04
    environment: typesafe
    timeout-minutes: 120
    steps:
      - name: Checkout Narness harness
        uses: actions/checkout@v4
        with:
          path: narness
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout subject repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.subject_repository || 'BestNathan/nession' }}
          ref: ${{ inputs.subject_ref || 'staging' }}
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Initialize System One evidence directory
        run: |
          evidence="$RUNNER_TEMP/system-one-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence/k8s" "$evidence/code-locator"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

      - name: Require TypeSafe credentials
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || vars.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_API_KEY" || {
            echo 'Set TYPESAFE_API_KEY in the typesafe environment.' >&2
            exit 2
          }

      - name: Initialize evidence manifest
        env:
          QUERY: ${{ inputs.query || 'Help me optimize the websocket connection implementation' }}
          SUBJECT_REPOSITORY: ${{ inputs.subject_repository || 'BestNathan/nession' }}
          SUBJECT_REF: ${{ inputs.subject_ref || 'staging' }}
          DIRECTORY_THRESHOLD: ${{ inputs.directory_threshold || '0.35' }}
          FILE_THRESHOLD: ${{ inputs.file_threshold || '0.50' }}
          LINE_THRESHOLD: ${{ inputs.line_threshold || '0.70' }}
          BATCH_SIZE: ${{ inputs.batch_size || '48' }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/system-one-research-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence/k8s" "$evidence/code-locator"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          def revision(path):
              return subprocess.check_output(
                  ["git", "-C", path, "rev-parse", "HEAD"], text=True
              ).strip()

          manifest = {
              "schema_version": 1,
              "kind": "system-one-research-evidence",
              "github": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "sha": os.environ.get("GITHUB_SHA"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              },
              "harness_revision": revision("narness"),
              "subject": {
                  "repository": os.environ["SUBJECT_REPOSITORY"],
                  "requested_ref": os.environ["SUBJECT_REF"],
                  "revision": revision("subject"),
              },
              "code_locator": {
                  "query": os.environ["QUERY"],
                  "thresholds": {
                      "directory": float(os.environ["DIRECTORY_THRESHOLD"]),
                      "file": float(os.environ["FILE_THRESHOLD"]),
                      "line": float(os.environ["LINE_THRESHOLD"]),
                  },
                  "batch_size": int(os.environ["BATCH_SIZE"]),
              },
              "model": os.environ["TYPESAFE_MODEL"],
          }
          root = Path(os.environ["EVIDENCE_DIR"])
          (root / "run-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n"
          )
          PY

      - name: Run Kubernetes System One demo
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || vars.TYPESAFE_API_KEY }}
          TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
        run: |
          set -euo pipefail
          python3 narness/examples/system-one-k8s/system_one_k8s.py             "Show me the Kubernetes logs for nession in staging."             --fixture narness/examples/system-one-k8s/fixtures/cluster.json             --json | tee "$EVIDENCE_DIR/k8s/result.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["EVIDENCE_DIR"])
          state = json.loads((root / "k8s/result.json").read_text())
          lines = [
              f"goal: {state['goal']}",
              f"context: {state.get('context') or '-'}",
              f"phase: {state['phase']}",
              "decisions:",
          ]
          for index, decision in enumerate(state.get("decisions", []), start=1):
              confidence = decision.get("confidence")
              suffix = f" confidence={confidence:.3f}" if confidence is not None else ""
              lines.append(
                  f"  {index}. {decision['action_id']} [{decision['source']}]{suffix}"
              )
          if state.get("final_command"):
              lines.append("final command: " + " ".join(state["final_command"]))
          (root / "k8s/stdout.log").write_text("\n".join(lines) + "\n")
          PY

      - name: Run code-localization System One demo
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || vars.TYPESAFE_API_KEY }}
          TYPESAFE_API_URL: ${{ vars.TYPESAFE_API_URL || 'https://api.typesafe.ai/v1/systemone' }}
          TYPESAFE_MODEL: ${{ vars.TYPESAFE_MODEL || 'jev-latest' }}
          QUERY: ${{ inputs.query }}
          DIRECTORY_THRESHOLD: ${{ inputs.directory_threshold }}
          FILE_THRESHOLD: ${{ inputs.file_threshold }}
          LINE_THRESHOLD: ${{ inputs.line_threshold }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          python3 narness/examples/system-one-code-locator/system_one_code_locator.py             subject "$QUERY"             --directory-threshold "$DIRECTORY_THRESHOLD"             --file-threshold "$FILE_THRESHOLD"             --line-threshold "$LINE_THRESHOLD"             --batch-size "$BATCH_SIZE"             --trace-file "$EVIDENCE_DIR/code-locator/trace.jsonl"             --output-json "$EVIDENCE_DIR/code-locator/result.json"             | tee "$EVIDENCE_DIR/code-locator/stdout.log"

      - name: Build research summary
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          lines = ["# System One research run", ""]
          manifest = root / "run-manifest.json"
          if manifest.exists():
              data = json.loads(manifest.read_text())
              lines += [
                  f"- Subject: `{data['subject']['repository']}@{data['subject']['revision']}`",
                  f"- Query: `{data['code_locator']['query']}`",
                  f"- Model: `{data['model']}`",
                  f"- Thresholds: `{data['code_locator']['thresholds']}`",
                  "",
              ]
          result = root / "code-locator/result.json"
          if result.exists():
              data = json.loads(result.read_text())
              lines += [
                  "## Code locator",
                  "",
                  f"- Directories: {len(data.get('directories', []))}",
                  f"- Files: {len(data.get('files', []))}",
                  f"- Snippets: {len(data.get('snippets', []))}",
                  f"- Metrics: `{data.get('metrics', {})}`",
                  "",
                  "### Selected files",
                  "",
              ]
              lines += [
                  f"- `{item['id']}` ({item['score']:.3f})"
                  for item in data.get("files", [])
              ]
          summary = "\n".join(lines) + "\n"
          (root / "summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write(summary)
          PY

      - name: Upload System One research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-one-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 90
          if-no-files-found: warn
