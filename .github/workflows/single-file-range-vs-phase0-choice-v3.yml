name: Probability Frontier v5 convergence

on:
  push:
    branches:
      - experiment/probability-frontier-v5-20260924

permissions:
  contents: read
  actions: read

env:
  QUERY: Help me optimize the websocket connection implementation
  SUBJECT_REPOSITORY: BestNathan/nession
  SUBJECT_SHA: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
  FILE_PATH: crates/nession-agent/src/server/websocket.rs
  HARNESS_REPOSITORY: BestNathan/system-one-code-explore
  HARNESS_REF: experiment/probability-frontier-v5-20260924
  TYPESAFE_MODEL: jev-latest
  TYPESAFE_API_URL: https://api.typesafe.ai/v1/systemone
  BASELINE_RUN_ID: "35959563085"
  BASELINE_ARTIFACT: full-read-cc-ds-baseline-35959563085

jobs:
  convergence:
    name: Reconstruct CC full-read relevance field
    runs-on: ubuntu-24.04
    environment: typesafe
    timeout-minutes: 120
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: BestNathan/system-one-code-explore
          ref: experiment/probability-frontier-v5-20260924
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          repository: BestNathan/nession
          ref: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download validated CC full-read reference
        uses: actions/download-artifact@v5
        with:
          name: full-read-cc-ds-baseline-35959563085
          path: artifacts/reference
          run-id: 35959563085
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run v5 unit tests
        run: |
          set -euo pipefail
          cd harness
          PYTHONPATH=src python3 -m unittest             tests.test_probability_frontier_v5             tests.test_probability_frontier_benchmark -v

      - name: Run 32-probe probability-frontier trajectory
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY || vars.TYPESAFE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$TYPESAFE_API_KEY"
          mkdir -p artifacts/v5
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          from pathlib import Path

          sys.path.insert(0, str(Path("harness/src").resolve()))

          from system_one_code_locator import Trace
          from system_one_probability_frontier import (
              ProbabilityFrontierDecider,
              phase0_probability_frontier,
          )

          root = Path("subject")
          path = os.environ["FILE_PATH"]
          source = root / path
          line_count = sum(1 for _ in source.open("r", encoding="utf-8"))
          trace = Trace("artifacts/v5/trace.jsonl")
          decider = ProbabilityFrontierDecider(
              os.environ["TYPESAFE_API_KEY"],
              trace,
              os.environ["TYPESAFE_API_URL"],
              os.environ["TYPESAFE_MODEL"],
          )

          started = time.perf_counter()
          result, usage = phase0_probability_frontier(
              root,
              os.environ["QUERY"],
              path,
              line_count,
              decider,
              sample_lines=8,
              max_epochs=40,
              max_actions=16,
              max_batch=4,
              probability_threshold=None,
              max_total_probes=32,
              respect_stop=False,
          )
          elapsed_ms = (time.perf_counter() - started) * 1000.0
          result["query"] = os.environ["QUERY"]
          result["model"] = os.environ["TYPESAFE_MODEL"]
          result["subject"] = {
              "repository": os.environ["SUBJECT_REPOSITORY"],
              "revision": os.environ["SUBJECT_SHA"],
              "path": path,
          }
          result["usage"] = usage
          result["elapsed_ms"] = round(elapsed_ms, 3)
          Path("artifacts/v5/run.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "probes": result["probes"],
              "sample_lines": result["sample_lines"],
              "snapshots": len(result["snapshots"]),
              "usage": usage,
              "elapsed_ms": result["elapsed_ms"],
          }, indent=2))
          PY

      - name: Compare every checkpoint with CC full-read field
        run: |
          set -euo pipefail
          python3 harness/src/probability_frontier_benchmark.py             --reference artifacts/reference/reference.json             --run artifacts/v5/run.json             --checkpoints 4,8,12,16,24,32             --high-threshold 0.70             --output-json artifacts/v5/convergence.json             --output-markdown artifacts/v5/convergence.md
          cat artifacts/v5/convergence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record sampled probes
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("artifacts/v5/run.json"))
          print("## Probe trajectory")
          print("")
          print("| epoch | probe ranges | Choice argmax | selected ids | forced |")
          print("| ---: | --- | --- | --- | --- |")
          for row in r["history"]:
              epoch = row["epoch"]
              if epoch == 0:
                  actions = row["actions"]
                  ranges = ", ".join(
                      f"{a['start_line']}-{a['end_line']}" for a in actions
                  )
                  print(f"| 0 | {ranges} | bootstrap | bootstrap | false |")
                  continue
              p = row["policy"]
              ranges = ", ".join(
                  f"{a['start_line']}-{a['end_line']}"
                  for a in p.get("selected_actions", [])
              )
              ids = ",".join(p.get("selected_ids", []))
              print(
                  f"| {epoch} | {ranges} | {p.get('argmax')} | "
                  f"{ids} | {bool(p.get('forced_progress'))} |"
              )
          PY

      - name: Upload convergence experiment
        uses: actions/upload-artifact@v4
        with:
          name: probability-frontier-v5-convergence-${{ github.run_id }}
          path: |
            artifacts/v5/
            artifacts/reference/reference.json
            artifacts/reference/evaluator.json
          if-no-files-found: error
          retention-days: 90
