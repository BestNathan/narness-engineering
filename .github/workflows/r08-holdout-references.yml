name: R08 holdout full-read references

on:
  push:
    branches:
      - experiment/r08-holdout-references-20260924
    paths:
      - ".github/workflows/r08-holdout-references.yml"

permissions:
  contents: read

env:
  SUBJECT_REPOSITORY: BestNathan/nession
  SUBJECT_SHA: 7ac9b6e0c2bb43c52f83e7dd706c0c0dc0d7a1df
  HARNESS_REPOSITORY: BestNathan/system-one-code-explore
  HARNESS_SHA: 4bcff59d6189bcfbcf3f04aa2d8ae0078ad34ade

jobs:
  reference:
    name: Reference / ${{ matrix.case.id }}
    runs-on: ubuntu-24.04
    environment: ds
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case:
          - id: reconnect_lifecycle
            path: crates/nession-agent/src/connection/server_client.rs
            query: >-
              Help me improve the agent-to-server reconnect lifecycle:
              exponential backoff, registration after reconnect,
              connected/sync-needed state transitions, and behavior of queued
              outbound messages while disconnected.
          - id: protocol_catalog_consistency
            path: crates/nession-protocol-codegen/src/catalog.rs
            query: >-
              Help me make protocol contract generation safer: locate the
              catalog code that defines unit identity and wire/request/response
              mappings and the checks that prevent missing, duplicate, or
              non-self-contained generated contracts.
          - id: full_stack_command_lifecycle
            path: crates/nession-server/tests/integration/full_stack.rs
            query: >-
              I am debugging the server's agent command lifecycle. Locate the
              integration-test code that exercises agent registration, command
              request/response routing, disconnect or reconnect behavior, and
              cleanup of pending work.
    env:
      CASE_ID: ${{ matrix.case.id }}
      FILE_PATH: ${{ matrix.case.path }}
      QUERY: ${{ matrix.case.query }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout frozen subject
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPOSITORY }}
          ref: ${{ env.SUBJECT_SHA }}
          path: subject
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Install pinned Claude Code
        run: npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.278

      - name: Prepare reference prompt
        run: |
          set -euo pipefail
          mkdir -p "artifacts/$CASE_ID"
          python3 harness/src/full_read_relevance_baseline.py prepare \
            --source "subject/$FILE_PATH" \
            --query "$QUERY" \
            --window-lines 64 \
            --stride-lines 32 \
            --output-prompt "artifacts/$CASE_ID/prompt.txt" \
            --output-manifest "artifacts/$CASE_ID/prompt-manifest.json"

      - name: Generate and validate full-read field
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.CLAUDE_MODEL || 'deepseek-flash' }}
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: "1"
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_BASE_URL"
          test -n "$ANTHROPIC_MODEL"
          echo "Reference model: $ANTHROPIC_MODEL"

          rm -f "artifacts/$CASE_ID/reference.json"
          for attempt in 1 2 3; do
            echo "Reference attempt $attempt"
            claude -p \
              --output-format text \
              --max-turns 4 \
              --permission-mode dontAsk \
              --no-session-persistence \
              --setting-sources '' \
              --strict-mcp-config \
              --mcp-config '{"mcpServers":{}}' \
              --disable-slash-commands \
              --tools '' \
              --settings '{"disableAllHooks":true}' \
              < "artifacts/$CASE_ID/prompt.txt" \
              > "artifacts/$CASE_ID/output-attempt-$attempt.txt" || true

            if python3 harness/src/full_read_relevance_baseline.py normalize \
              --source "subject/$FILE_PATH" \
              --query "$QUERY" \
              --window-lines 64 \
              --stride-lines 32 \
              --raw-output "artifacts/$CASE_ID/output-attempt-$attempt.txt" \
              --output "artifacts/$CASE_ID/reference.json"; then
              cp "artifacts/$CASE_ID/output-attempt-$attempt.txt" \
                "artifacts/$CASE_ID/output.txt"
              echo "$attempt" > "artifacts/$CASE_ID/accepted-attempt.txt"
              break
            fi
            rm -f "artifacts/$CASE_ID/reference.json"
          done
          test -s "artifacts/$CASE_ID/reference.json"

      - name: Record provenance
        env:
          CC_MODEL: ${{ vars.CLAUDE_MODEL || 'deepseek-flash' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("artifacts") / os.environ["CASE_ID"]
          ref = json.loads((root / "reference.json").read_text())
          data = {
              "case_id": os.environ["CASE_ID"],
              "task": os.environ["QUERY"],
              "path": os.environ["FILE_PATH"],
              "subject_repository": os.environ["SUBJECT_REPOSITORY"],
              "subject_sha": os.environ["SUBJECT_SHA"],
              "harness_repository": os.environ["HARNESS_REPOSITORY"],
              "harness_sha": os.environ["HARNESS_SHA"],
              "runtime": "claude-code",
              "environment": "ds",
              "model": os.environ["CC_MODEL"],
              "line_count": ref["line_count"],
              "ranges": len(ref["ranges"]),
          }
          (root / "provenance.json").write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n"
          )
          PY

      - name: Upload reference
        uses: actions/upload-artifact@v4
        with:
          name: r08-holdout-reference-${{ matrix.case.id }}
          path: artifacts/${{ matrix.case.id }}/
          if-no-files-found: error
          retention-days: 90
