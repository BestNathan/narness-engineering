name: AI Native Codex Pilots - Frozen Self Hosted Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-native-codex-pilots-self-hosted-trigger.yml'
      - 'docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09/PILOT-SELFHOSTED-TRIGGER'

permissions:
  contents: read

concurrency:
  group: ai-native-codex-pilots-r2-frozen
  cancel-in-progress: false

jobs:
  pilots:
    runs-on: [self-hosted, ai-native-research]
    timeout-minutes: 240

    steps:
      - name: Checkout frozen Narness pre-pilot revision
        uses: actions/checkout@v4
        with:
          ref: d01117beb44e57c24cb6b73ae8c4c9f89100e825
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Nession source repository
        uses: actions/checkout@v4
        with:
          repository: BestNathan/nession
          path: nession
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted runner and frozen harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d01117beb44e57c24cb6b73ae8c4c9f89100e825"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${CODEX_ACCESS_TOKEN:-}"
          codex --version
          codex login status
          test -z "$(git -C "$GITHUB_WORKSPACE/nession" status --porcelain --untracked-files=no)"
          python3 scripts/validate-ai-native-benchmark.py             --source-repo "$GITHUB_WORKSPACE/nession"

      - name: Run three non-reportable instrumentation pilots
        shell: bash
        env:
          PILOT_OUTPUT: ${{ runner.temp }}/ai-native-codex-pilots
        run: |
          set -euo pipefail
          bash ./scripts/run-ai-native-codex-pilots.sh             "$GITHUB_WORKSPACE/nession"             "$PILOT_OUTPUT"

      - name: Validate generated pilot handoff
        if: success()
        shell: bash
        env:
          PILOT_OUTPUT: ${{ runner.temp }}/ai-native-codex-pilots
        run: |
          set -euo pipefail
          EXP="docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09"
          HANDOFF="${{ runner.temp }}/pilot-handoff"
          mkdir -p "$HANDOFF"
          {
            echo "workflow_run_id=${{ github.run_id }}"
            echo "repository_sha=$(git rev-parse HEAD)"
            echo "runner_name=${{ runner.name }}"
            echo "runner_os=${{ runner.os }}"
            echo "codex_version=$(codex --version 2>/dev/null || true)"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$HANDOFF/workflow-metadata.txt"
          cp "$EXP/runner/execution-profile-r1.json" "$HANDOFF/"
          cp "$EXP/runner/formal-schedule-r1.json" "$HANDOFF/"
          cp "$EXP/runner/formal-plan-r1.lock.json" "$HANDOFF/"
          cp -R "$PILOT_OUTPUT" "$HANDOFF/pilot-runs"

          python3 scripts/validate-ai-native-pilot-handoff.py             --handoff-dir "$HANDOFF"             --output "$HANDOFF/promotion-validation.json"

      - name: Capture failed pilot handoff
        if: failure()
        shell: bash
        env:
          PILOT_OUTPUT: ${{ runner.temp }}/ai-native-codex-pilots
        run: |
          set -euo pipefail
          EXP="docs/topics/agent-native-repository-architecture/research/experiments/nession-terminal-session-reconnect-2026-09"
          HANDOFF="${{ runner.temp }}/pilot-handoff"
          mkdir -p "$HANDOFF"
          {
            echo "workflow_run_id=${{ github.run_id }}"
            echo "repository_sha=$(git rev-parse HEAD 2>/dev/null || true)"
            echo "runner_name=${{ runner.name }}"
            echo "runner_os=${{ runner.os }}"
            echo "codex_version=$(codex --version 2>/dev/null || true)"
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$HANDOFF/workflow-metadata.txt"
          for file in             "$EXP/runner/execution-profile-r1.json"             "$EXP/runner/formal-schedule-r1.json"             "$EXP/runner/formal-plan-r1.lock.json"; do
            [[ -f "$file" ]] && cp "$file" "$HANDOFF/"
          done
          [[ -d "$PILOT_OUTPUT" ]] && cp -R "$PILOT_OUTPUT" "$HANDOFF/pilot-runs"

      - name: Upload pilot handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-native-codex-pilots-r2-${{ github.run_id }}
          path: ${{ runner.temp }}/pilot-handoff
          if-no-files-found: error
          retention-days: 30
