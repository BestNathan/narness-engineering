[package]
name = "narness-policy"
version = "0.1.0"
edition = "2021"
description = "Narness policy engine: parse an agent tool call into a semantic AST and evaluate it against a policy IR"

[lib]
name = "narness_policy"
path = "src/lib.rs"

[[bin]]
name = "narness-policy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
