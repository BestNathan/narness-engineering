# ci.yml — copyable authoritative Rust merge gate.
# Copy to: <workspace root>/.github/workflows/ci.yml
#
# Validation logic stays in deterministic scripts. This workflow only
# orchestrates full-scope evidence and exposes one stable "required" status.

name: ci

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt
      - run: bash plugins/narness/scripts/narness-rust-fmt.sh

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash plugins/narness/scripts/narness-rust-invariants.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy
      - run: bash plugins/narness/scripts/narness-rust-clippy.sh --scope=full

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: bash plugins/narness/scripts/narness-rust-test-unit.sh --scope=full --coverage

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: bash plugins/narness/scripts/narness-rust-test-integration.sh --scope=full --coverage

  required:
    name: required
    if: always()
    needs:
      - format
      - invariants
      - lint
      - dependency-audit
      - unit
      - integration
    runs-on: ubuntu-latest
    steps:
      - name: Verify required evidence
        env:
          FORMAT: ${{ needs.format.result }}
          INVARIANTS: ${{ needs.invariants.result }}
          LINT: ${{ needs.lint.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          test "$FORMAT" = "success"
          test "$INVARIANTS" = "success"
          test "$LINT" = "success"
          test "$AUDIT" = "success"
          test "$UNIT" = "success"
          test "$INTEGRATION" = "success"
